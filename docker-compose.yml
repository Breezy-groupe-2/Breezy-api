services:
  auth-db:
    image: mongo:latest
    container_name: breezy-auth-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_auth
    volumes:
      - auth_db_data:/data/db
    networks:
      - breezy-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - breezy-network
    restart: unless-stopped

  api-gateway:
    image: nginx:alpine
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - post-service
      - comment-service
      - follow-service
      - feed-service
      - profile-service
      - swagger-service
    networks:
      - breezy-network
    restart: unless-stopped

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: ${POST_SERVICE_MONGODB_URI:?POST_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - post-db
    networks:
      - breezy-network
    restart: unless-stopped

  post-db:
    image: mongo:latest
    container_name: breezy-post-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_posts
    volumes:
      - post_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URI: ${COMMENT_SERVICE_MONGODB_URI:?COMMENT_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      - comment-db
    networks:
      - breezy-network
    restart: unless-stopped

  comment-db:
    image: mongo:latest
    container_name: breezy-comment-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_comments
    volumes:
      - comment_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  follow-service:
    build:
      context: ./follow-service
      dockerfile: Dockerfile
    ports:
      - '3006:3006'
    environment:
      NODE_ENV: production
      PORT: 3006
      MONGODB_URI: ${FOLLOW_SERVICE_MONGODB_URI:?FOLLOW_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - breezy-network
    restart: unless-stopped

  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGODB_URI: ${FEED_SERVICE_MONGODB_URI:?FEED_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - breezy-network
    restart: unless-stopped

  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    ports:
      - '3007:3007'
    environment:
      NODE_ENV: production
      PORT: 3007
      MONGODB_URI: ${PROFILE_SERVICE_MONGODB_URI:?PROFILE_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      - profile-db
      - auth-service
    networks:
      - breezy-network
    restart: unless-stopped

  profile-db:
    image: mongo:latest
    container_name: breezy-profile-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_profiles
    volumes:
      - profile_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  swagger-service:
    build:
      context: ./swagger-service
      dockerfile: Dockerfile
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: 3005
    networks:
      - breezy-network
    restart: unless-stopped

volumes:
  auth_db_data:
  post_db_data:
  comment_db_data:
  profile_db_data:

networks:
  breezy-network:
    driver: bridge
