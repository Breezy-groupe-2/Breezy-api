services:
  # 🐘 Database for Auth Service
  auth-db:
    image: mongo:latest
    container_name: breezy-auth-db
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: breezy_auth
    volumes:
      - auth_db_data:/data/db
    networks:
      - breezy-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # 🔐 Auth Service
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: breezy-auth-service
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI:-mongodb://admin:admin123@auth-db:27017/breezy_auth?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - breezy-network
    restart: unless-stopped

  # 🌐 API Gateway
  api-gateway:
    image: nginx:alpine
    container_name: breezy-api-gateway
    ports:
      - '3000:3000'
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - post-service
      - comment-service
      - follow-service
      - feed-service
      - profile-service
      - swagger-service
    networks:
      - breezy-network
    restart: unless-stopped

  # 📝 Post Service (placeholder)
  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    container_name: breezy-post-service
    ports:
      - '3002:3002'
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: ${POST_SERVICE_MONGODB_URI:-mongodb://admin:admin123@post-db:27017/breezy_posts?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      - post-db
    networks:
      - breezy-network
    restart: unless-stopped

  post-db:
    image: mongo:latest
    container_name: breezy-post-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: breezy_posts
    volumes:
      - post_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  # 💬 Comment Service (placeholder)
  comment-service:
    build:
      context: ./comment-service
      dockerfile: Dockerfile
    container_name: breezy-comment-service
    ports:
      - '3003:3003'
    environment:
      NODE_ENV: production
      PORT: 3003
      MONGODB_URI: ${COMMENT_SERVICE_MONGODB_URI:-mongodb://admin:admin123@comment-db:27017/breezy_comments?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      - comment-db
    networks:
      - breezy-network
    restart: unless-stopped

  comment-db:
    image: mongo:latest
    container_name: breezy-comment-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: breezy_comments
    volumes:
      - comment_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  # 🤝 Follow Service
  follow-service:
    build:
      context: ./follow-service
      dockerfile: Dockerfile
    container_name: breezy-follow-service
    ports:
      - '3006:3006'
    environment:
      NODE_ENV: production
      PORT: 3006
      MONGODB_URI: ${FOLLOW_SERVICE_MONGODB_URI:-mongodb://admin:admin123@auth-db:27017/breezy_auth?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - breezy-network
    restart: unless-stopped

  # 📰 Feed Service
  feed-service:
    build:
      context: ./feed-service
      dockerfile: Dockerfile
    container_name: breezy-feed-service
    ports:
      - '3004:3004'
    environment:
      NODE_ENV: production
      PORT: 3004
      MONGODB_URI: ${FEED_SERVICE_MONGODB_URI:-mongodb://admin:admin123@auth-db:27017/breezy_auth?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - breezy-network
    restart: unless-stopped

  # 👤 Profile Service
  profile-service:
    build:
      context: ./profile-service
      dockerfile: Dockerfile
    container_name: breezy-profile-service
    ports:
      - '3007:3007'
    environment:
      NODE_ENV: production
      PORT: 3007
      MONGODB_URI: ${PROFILE_SERVICE_MONGODB_URI:-mongodb://admin:admin123@profile-db:27017/breezy_profiles?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      AUTH_SERVICE_URL: http://auth-service:3001
    depends_on:
      - profile-db
      - auth-service
    networks:
      - breezy-network
    restart: unless-stopped

  profile-db:
    image: mongo:latest
    container_name: breezy-profile-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: breezy_profiles
    volumes:
      - profile_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  # 📖 Swagger Documentation Service
  swagger-service:
    build:
      context: ./swagger-service
      dockerfile: Dockerfile
    container_name: breezy-swagger-service
    ports:
      - '3005:3005'
    environment:
      NODE_ENV: production
      PORT: 3005
    networks:
      - breezy-network
    restart: unless-stopped

volumes:
  auth_db_data:
  post_db_data:
  comment_db_data:
  profile_db_data:

networks:
  breezy-network:
    driver: bridge
