services:
  auth-db:
    image: mongo:latest
    container_name: breezy-auth-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_auth
    volumes:
      - auth_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  auth-profile-service:
    build:
      context: .
      dockerfile: auth-profile.Dockerfile
    environment:
      NODE_ENV: production
      AUTH_SERVICE_PORT: 3001
      PROFILE_SERVICE_PORT: 3007
      AUTH_SERVICE_MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      PROFILE_SERVICE_MONGODB_URI: ${PROFILE_SERVICE_MONGODB_URI:?PROFILE_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRE: ${JWT_EXPIRE:-7d}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_SERVICE_URL: http://localhost:3001
    depends_on:
      auth-db:
        condition: service_healthy
      profile-db:
        condition: service_started
    networks:
      - breezy-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - '${API_GATEWAY_PORT:-3000}:3000'
    depends_on:
      - auth-profile-service
      - post-service
      - comment-feed-follow-service
      - swagger-service
    networks:
      - breezy-network
    restart: unless-stopped

  post-service:
    build:
      context: ./post-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: ${POST_SERVICE_MONGODB_URI:?POST_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-profile-service:3001
      S3_ENDPOINT: ${S3_ENDPOINT:?S3_ENDPOINT is required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?S3_BUCKET_NAME is required}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL is required}
      COMMENT_SERVICE_URL: http://comment-feed-follow-service:3003
    depends_on:
      - post-db
    networks:
      - breezy-network
    restart: unless-stopped

  post-db:
    image: mongo:latest
    container_name: breezy-post-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_posts
    volumes:
      - post_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  comment-feed-follow-service:
    build:
      context: .
      dockerfile: comment-feed-follow.Dockerfile
    environment:
      NODE_ENV: production
      COMMENT_SERVICE_PORT: 3003
      FEED_SERVICE_PORT: 3004
      FOLLOW_SERVICE_PORT: 3006
      COMMENT_SERVICE_MONGODB_URI: ${COMMENT_SERVICE_MONGODB_URI:?COMMENT_SERVICE_MONGODB_URI is required}
      FEED_SERVICE_MONGODB_URI: ${FEED_SERVICE_MONGODB_URI:?FEED_SERVICE_MONGODB_URI is required}
      FOLLOW_SERVICE_MONGODB_URI: ${FOLLOW_SERVICE_MONGODB_URI:?FOLLOW_SERVICE_MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_SERVICE_URL: http://auth-profile-service:3001
      FOLLOW_SERVICE_URL: http://localhost:3006
      POST_SERVICE_URL: http://post-service:3002
    depends_on:
      auth-db:
        condition: service_healthy
      comment-db:
        condition: service_started
      follow-db:
        condition: service_started
    networks:
      - breezy-network
    restart: unless-stopped

  comment-db:
    image: mongo:latest
    container_name: breezy-comment-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_comments
    volumes:
      - comment_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  follow-db:
    image: mongo:latest
    container_name: breezy-follow-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_follow
    volumes:
      - follow_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  profile-db:
    image: mongo:latest
    container_name: breezy-profile-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: breezy_profiles
    volumes:
      - profile_db_data:/data/db
    networks:
      - breezy-network
    restart: unless-stopped

  swagger-service:
    build:
      context: ./swagger-service
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3005
    networks:
      - breezy-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: breezy-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - breezy-network
    restart: unless-stopped

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to start...';
      until /usr/bin/mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required} ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required} 2>/dev/null; do
        sleep 1;
      done;
      /usr/bin/mc mb local/${S3_BUCKET_NAME:?S3_BUCKET_NAME is required} || true;
      /usr/bin/mc anonymous set public local/${S3_BUCKET_NAME:?S3_BUCKET_NAME is required};
      exit 0;
      "
    networks:
      - breezy-network

volumes:
  auth_db_data:
  post_db_data:
  comment_db_data:
  follow_db_data:
  profile_db_data:
  minio_data:

networks:
  breezy-network:
    driver: bridge
