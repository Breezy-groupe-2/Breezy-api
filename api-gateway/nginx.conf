events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Limit media upload to 250 requests per minute (approx. 4.16 req/sec) per client IP
    limit_req_zone $binary_remote_addr zone=media_upload_limit:10m rate=250r/m;

    server {
        listen 3000;

        # CORS is handled at the gateway so browser preflight never depends on
        # a downstream service being ready. Local Compose defaults this to "*".
        add_header 'Access-Control-Allow-Origin' '${CORS_ALLOWED_ORIGIN}' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, User-Agent' always;
        add_header 'Vary' 'Origin' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Common proxy parameters
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /health {
            default_type application/json;
            return 200 '{"status": "API Gateway is running"}';
        }

        # Auth Service
        location /api/v1/auth {
            set $auth_upstream http://auth-profile-service:3001;
            proxy_pass $auth_upstream;
        }

        # Comment Service
        location ~ ^/api/v1/posts/[^/]+/comments(?:/|$) {
            set $comment_upstream http://comment-feed-follow-service:3003;
            proxy_pass $comment_upstream;
        }

        location /api/v1/comments {
            set $comment_upstream http://comment-feed-follow-service:3003;
            proxy_pass $comment_upstream;
        }

        # Follow Service
        location ~ ^/api/v1/users/[^/]+/(?:follow|followers|following)$ {
            set $follow_upstream http://comment-feed-follow-service:3006;
            proxy_pass $follow_upstream;
        }

        # User identity (auth-service): GET /api/v1/users/:idOrUsername and GET/PUT /api/v1/users/me
        location ~ ^/api/v1/users/[^/]+$ {
            set $auth_upstream http://auth-profile-service:3001;
            proxy_pass $auth_upstream;
        }

        # Auth Service Users (moderation and admin routes)
        location ~ ^/api/v1/users(?:/|$) {
            set $auth_upstream http://auth-profile-service:3001;
            proxy_pass $auth_upstream;
        }

        # Post Service
        location /api/v1/posts {
            set $post_upstream http://post-service:3002;
            proxy_pass $post_upstream;
        }

        # Media Upload Route (forward to Post Service)
        location /api/v1/media {
            client_max_body_size 10m;
            limit_req zone=media_upload_limit burst=10 nodelay;
            limit_req_status 429;

            set $post_upstream http://post-service:3002;
            proxy_pass $post_upstream;
        }

        # Public S3 Local Bucket Proxy
        location /breezy-media/ {
            set $minio_upstream http://minio:9000;
            proxy_pass $minio_upstream$request_uri;
        }


        # Feed Service
        location /api/v1/feed {
            set $feed_upstream http://comment-feed-follow-service:3004;
            proxy_pass $feed_upstream;
        }

        # Follow Service routing for Swagger
        location /api/v1/follow {
            set $follow_upstream http://comment-feed-follow-service:3006;
            proxy_pass $follow_upstream;
        }

        # Moderation Service (admin dashboard: reports + accounts)
        location /api/v1/moderation {
            set $auth_upstream http://auth-profile-service:3001;
            proxy_pass $auth_upstream;
        }

        # Swagger Documentation (Unified)
        location /api-docs {
            set $swagger_upstream http://swagger-service:3005;
            proxy_pass $swagger_upstream;
        }
    }
}
